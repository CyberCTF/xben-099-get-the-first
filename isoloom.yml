# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-099-24 Get the first (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# getTheFirst, a Node.js and MongoDB application where users register, log in, and view profiles. It shows when its first user was created.
# The benchmark folder benchmarks/XBEN-099-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/app/app/, built by its own Dockerfiles; the overlay in build/app/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-099-get-the-first

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.142.0/24, internet: false }

machines:
  app:
    networks: { lab: 10 }
    services: [{ port: 3000, name: web, http: true, publish: 3000 }]
    resources: { cpus: 1, memory_mb: 512 }
    depends_on: [mongodb]
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/app
      init: [ctf/flag.sh]

  mongodb:
    networks: { lab: 20 }
    services: [{ port: 27017, name: mongodb }]
    resources: { cpus: 1, memory_mb: 1024 }
    docker:
      build: build/mongodb

checks:
  - name: the Get the first page answers
    http: http://app:3000/
    wait: 180
  - name: the info page counts the users in MongoDB
    script: checks/probe.sh
    wait: 60

message: |
  Get the first answers at http://localhost:{{ machines.app.services.0.publish }}/.
  View the first user ever created. The application tells you when it started.
